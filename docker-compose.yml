services:
  app:
    build: .
    container_name: tilda-saby-app
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_PATH: /data/orders.db
      PRODUCT_MAP_PATH: /app/product_map.json
    volumes:
      - ./data:/data
      - ./product_map.json:/app/product_map.json:ro
    expose:
      - "8010"

  caddy:
    image: caddy:2-alpine
    container_name: tilda-saby-caddy
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
